[package]
name = "winrt-ai"
version = "0.1.0"
edition = "2021"
description = "AI-Native Windows Compatibility Runtime — PE loader, trace, replay, and AI analysis"

[dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
goblin = "0.9"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
which = "7"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "winrt-ai"
path = "src/main.rs"

[lib]
name = "winrt_ai"
path = "src/lib.rs"

[profile.release]
opt-level = 2
debug = true
